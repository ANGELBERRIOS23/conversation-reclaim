name: portable desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Conversation-Reclaim-Windows-x64
            package: artifacts/Conversation-Reclaim-Windows-x64.zip
          - os: macos-15
            artifact: Conversation-Reclaim-macOS-arm64
            package: artifacts/Conversation-Reclaim-macOS-arm64.zip
          - os: macos-15-intel
            artifact: Conversation-Reclaim-macOS-x64
            package: artifacts/Conversation-Reclaim-macOS-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend and native engine
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app
      - name: Package Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Compress-Archive -Path "src-tauri/target/release/conversation-reclaim.exe" -DestinationPath "${{ matrix.package }}"
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          codesign --force --deep --sign - "src-tauri/target/release/bundle/macos/Conversation Reclaim.app"
          codesign --verify --deep --strict "src-tauri/target/release/bundle/macos/Conversation Reclaim.app"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Conversation Reclaim.app" "${{ matrix.package }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish portable packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip --generate-notes --verify-tag
