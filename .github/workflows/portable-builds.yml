name: desktop builds and releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (for example v3.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test release tooling
        run: npm run test:release
      - name: Verify release version alignment
        run: npm run check:release-version

  build:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Conversation-Reclaim-Windows-x64
          - os: macos-15
            artifact: Conversation-Reclaim-macOS-arm64
          - os: macos-15-intel
            artifact: Conversation-Reclaim-macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend and native engine
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer and portable executable
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles nsis
      - name: Build macOS application
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles app
      - name: Package Windows editions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "artifacts/Conversation-Reclaim-Windows-x64-Setup.exe"
          Copy-Item "$($setup.FullName).sig" "artifacts/Conversation-Reclaim-Windows-x64-Setup.exe.sig"
          Compress-Archive -Path "src-tauri/target/release/conversation-reclaim.exe" -DestinationPath "artifacts/Conversation-Reclaim-Windows-x64-Portable.zip"
      - name: Package macOS edition
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.artifact }}" == *"arm64" ]]; then ARCH="arm64"; else ARCH="x64"; fi
          codesign --verify --deep --strict "src-tauri/target/release/bundle/macos/Conversation Reclaim.app"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Conversation Reclaim.app" "artifacts/Conversation-Reclaim-macOS-$ARCH.zip"
          UPDATER_ARCHIVE=$(find src-tauri/target/release/bundle/macos -name '*.app.tar.gz' -type f -print -quit)
          test -n "$UPDATER_ARCHIVE"
          cp "$UPDATER_ARCHIVE" "artifacts/Conversation-Reclaim-macOS-$ARCH.app.tar.gz"
          cp "$UPDATER_ARCHIVE.sig" "artifacts/Conversation-Reclaim-macOS-$ARCH.app.tar.gz.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > release-notes.md
      - name: Generate signed updater index
        run: node scripts/generate-latest-json.mjs artifacts
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES_FILE: release-notes.md
      - name: Publish native desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" artifacts/* --notes-file release-notes.md --verify-tag --title "Conversation Reclaim $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" artifacts/* --notes-file release-notes.md --target "$GITHUB_SHA" --title "Conversation Reclaim $RELEASE_TAG"
          fi
